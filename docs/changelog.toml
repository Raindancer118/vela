# One entry per pushed tag. Date, time, lines and commits come from git;
# scripts/changelog.py refuses to build while a tag has no entry here.
# area: launcher, panel, hyprland, settings, claude, pulse, updates, nixos, install, share, docs

[intro]
title = "The logbook"
lede = "Every tag we pushed, newest on top. vela started as a Spotlight clone on a Wednesday evening and was a whole desktop shell by Saturday afternoon."

["0.46.7"]
area = ["updates", "nixos", "launcher"]
title = "Self-update works again"
notes = [
  "Since 0.45.0 the release archive lacked vela-pulse, so Settings → System → Update failed before installing anything. The archive now packs every binary the crate builds, and the installer test installs from it like the update does. NixOS was not affected: it builds from source with nix.",
  "A Nix profile that appears after vela started (your first `nix profile install`, a new per-user profile) is picked up too, and so are switches that repoint /run/current-system with `ln -sfn`.",
  "Release notes on GitHub now come from this changelog.",
]

["0.46.6"]
area = ["nixos", "launcher"]
title = "Apps from a NixOS rebuild show up right away"
notes = [
  "A rebuild doesn't touch the application folders, it only repoints symlinks like /run/current-system. vela now watches every link on the way and follows the switch, so `vela reload` after a rebuild is no longer needed.",
  "Settings → Pulse: the “&” in “Apps & processes” no longer breaks two descriptions.",
]

["0.46.5"]
area = ["hyprland"]
title = "Dragging a monitor no longer shakes the page"
notes = ["A tile pulled past the edge grew the canvas, and everything below it moved under the pointer. Tiles now stay inside."]

["0.46.4"]
area = ["hyprland"]
title = "Monitors stop flickering while you drag them"
notes = [
  "The drag gesture sat on the tile it moved, so every step fed into the next. One gesture on the canvas now picks the tile under the pointer.",
  "The shell test runs on a private bus without portals: no more coredump per test run.",
]

["0.46.3"]
area = ["pulse"]
title = "Pulse opens again after you closed its window"
notes = ["Closing the window ends Pulse. `vela pulse` asks a running Pulse whether it still has a window instead of assuming it does."]

["0.46.2"]
area = ["install"]
title = "Updating while Pulse runs keeps its window"
notes = ["Pulse and the share picker get their entry files last, so an instance that reloads mid-copy reloads once more with everything in place."]

["0.46.1"]
area = ["pulse"]
title = "No more “Programs wait for the disk” on an idle disk"
notes = ["io_uring waits (Ghostty, node) count as iowait. The finding now needs a busy disk, swapping or a process really waiting on storage."]

["0.46.0"]
area = ["pulse"]
title = "CPU temperature in the graphs"
notes = [
  "Overall and per core on their own °C scale, recorded for the long ranges too. Cores the heat slows down turn red.",
  "Asking Claude about a finding hands over that finding only, and says it may be a false alarm.",
]

["0.45.0"]
area = ["pulse", "nixos"]
title = "Pulse, a task manager"
notes = [
  "Apps and processes grouped from systemd cgroups. End, force quit, restart, pause, efficiency mode; keys k, g, r, p, e.",
  "Diagnosis with a health score and findings, each with its own Claude button. Performance graphs over an hour, a day or a week.",
  "An activity timeline that remembers seven days: load, heat, throttling, network, mounts, crashes, how long terminal tasks ran.",
  "On NixOS, Pulse finds the host's tools even when started as a bare user service.",
]

["0.44.0"]
area = ["nixos", "settings"]
title = "Features switch on NixOS without a rebuild"
notes = ["With Home Manager's stateDir, Settings → System → Features writes components.toml and applies it live."]

["0.43.0"]
area = ["launcher", "panel"]
title = "Your own keys for launcher and control center"
notes = ["Recorded like any shortcut, they replace a hyprland.lua bind on the same keys. The Super tap can be switched off; tap toggles the control center, hold peeks."]

