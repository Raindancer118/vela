name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell libadwaita github-cli python
      - uses: actions/checkout@v5
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package
        run: scripts/package.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if python3 scripts/changelog.py --notes "$GITHUB_REF_NAME" >notes.md; then
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "vela $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "vela $GITHUB_REF_NAME" --generate-notes
          fi
