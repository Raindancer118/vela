name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # GTK 4.14+, libadwaita 1.6 and gtk4-layer-shell are current on Arch.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell libadwaita weston adwaita-icon-theme
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Start-up test (headless Wayland)
        run: |
          cargo build --release --locked
          ./target/release/vela --version
          scripts/smoke-test.sh target/release/vela
