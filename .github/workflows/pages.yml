name: Changelog page

# Only on release tags (and by hand): Pages names a deployment after the commit,
# so a tag on a commit main already deployed would be skipped as a duplicate.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # dates and line counts come from the tags
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build
        run: |
          pip install fonttools
          python3 scripts/changelog.py
          mkdir -p _site && cp docs/changelog.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
